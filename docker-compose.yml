services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    ports:
      - "8080:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
    restart: unless-stopped
    networks:
      - voice-ai-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage:z
    restart: unless-stopped
    networks:
      - voice-ai-network

  voice-ai-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voice_ai_all_in_one
    ports:
      - "5173:5173"       # Vite Frontend UI (Nginx)
      - "8000:8000"       # FastAPI Backend API & WebRTC
      - "5060:5060/udp"   # FreeSWITCH SIP UDP
      - "5060:5060/tcp"   # FreeSWITCH SIP TCP
      - "8021:8021"       # FreeSWITCH ESL
      - "8086:8086"       # FreeSWITCH Audio Stream
    env_file:
      - path: .env
        required: false
      - path: ./backend/.env
        required: false
    environment:
      - SEARXNG_URL=http://searxng:8080
      - FREESWITCH_HOST=127.0.0.1:8021
      - QDRANT_URL=http://qdrant:6333
      - VECTOR_DB=qdrant
    volumes:
      - ./data:/app/backend/data
    depends_on:
      - searxng
      - qdrant
    restart: unless-stopped
    networks:
      - voice-ai-network

networks:
  voice-ai-network:
    name: voice-ai-network
    driver: bridge
