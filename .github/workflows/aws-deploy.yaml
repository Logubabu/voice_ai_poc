name: Build and Deploy to ECS

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_service:
        description: 'Select ECS service to deploy (or "all" for all 3 services)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - voice-ai-service-VAI
          - voice-ai-service-be
          - voice-ai-fe-service

env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: voice-ai-poc
  ECS_CLUSTER: voice_ai_fr_cluster
  TASK_DEFINITION: voice-ai-task-definition
  CONTAINER_NAME: voice-ai

jobs:
  deploy:
    name: Build, Validate, and Deploy to ECS Fargate (3 Services)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building Docker image for platform linux/amd64: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build --platform linux/amd64 \
            --build-arg GIT_COMMIT_SHA=${{ github.sha }} \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "Pushing Docker images to Amazon ECR..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

          echo "Verifying ECR image digest..."
          ECR_DIGEST=$(aws ecr describe-images \
            --repository-name ${{ env.ECR_REPOSITORY }} \
            --image-ids imageTag=$IMAGE_TAG \
            --region ${{ env.AWS_REGION }} \
            --query "imageDetails[0].imageDigest" \
            --output text 2>/dev/null || echo "N/A")
          echo "ECR Image Tag:    $IMAGE_TAG"
          echo "ECR Image Digest: $ECR_DIGEST"

          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "image_digest=$ECR_DIGEST" >> $GITHUB_OUTPUT

      - name: Prepare and sanitize task definition for AWS Fargate
        id: prep-task-def
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          STT_API_KEY: ${{ secrets.STT_API_KEY }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TTS_API_KEY: ${{ secrets.TTS_API_KEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
        run: |
          echo "Downloading current active task definition or using repository fallback..."
          if aws ecs describe-task-definition --task-definition ${{ env.TASK_DEFINITION }} --query taskDefinition > raw-task-def.json 2>/dev/null; then
            echo "Successfully retrieved task definition from AWS ECS."
            BASE_DEF="raw-task-def.json"
          else
            echo "Notice: Could not fetch active task definition from ECS. Using repo task-definition.json."
            BASE_DEF="task-definition.json"
          fi

          python -c '
          import os
          import json

          base_file = "'"$BASE_DEF"'"
          with open(base_file, "r") as f:
              td = json.load(f)

          # 1. Strip AWS-managed read-only metadata fields rejected by RegisterTaskDefinition
          readonly_fields = [
              "taskDefinitionArn", "revision", "status", "requiresAttributes",
              "compatibilities", "registeredAt", "registeredBy"
          ]
          for field in readonly_fields:
              td.pop(field, None)

          # 2. Strict AWS Fargate configuration
          td["requiresCompatibilities"] = ["FARGATE"]
          td["networkMode"] = "awsvpc"

          if "runtimePlatform" not in td:
              td["runtimePlatform"] = {
                  "cpuArchitecture": "X86_64",
                  "operatingSystemFamily": "LINUX"
              }

          # 3. Purge SYS_NICE, SYS_RESOURCE, and unsupported Linux capabilities
          forbidden_caps = {"SYS_NICE", "SYS_RESOURCE", "SYS_ADMIN", "NET_ADMIN", "ALL"}
          for c in td.get("containerDefinitions", []):
              if "privileged" in c:
                  c["privileged"] = False

              lp = c.get("linuxParameters")
              if lp:
                  caps = lp.get("capabilities")
                  if caps:
                      if "add" in caps:
                          caps["add"] = [cap for cap in caps["add"] if cap not in forbidden_caps]
                          if not caps["add"]:
                              caps.pop("add", None)
                      if "drop" in caps and not caps["drop"]:
                          caps.pop("drop", None)
                      if not caps:
                          lp.pop("capabilities", None)
                  # If linuxParameters has no parameters left, remove it entirely
                  if not lp:
                      c.pop("linuxParameters", None)

              # 4. Inject runtime environment configuration and secrets
              env_list = c.setdefault("environment", [])
              existing = {item.get("name"): item for item in env_list}

              # Default working configurations
              defaults = {
                  "PYTHONUNBUFFERED": "1",
                  "ENVIRONMENT": "production",
                  "LOG_LEVEL": "INFO",
                  "STT_PROVIDER": "groq",
                  "LLM_PROVIDER": "google",
                  "LLM_MODEL": "gemini-3.5-flash",
                  "TTS_PROVIDER": "elevenlabs",
                  "ELEVENLABS_VOICE_ID": "JBFqnCBsd6RMkjVDRZzb",
                  "ELEVENLABS_MODEL": "eleven_flash_v2_5",
                  "CORS_ALLOW_ALL": "true",
                  "FREESWITCH_ENABLED": "true",
                  "FREESWITCH_HOST": "127.0.0.1:8021",
                  "WEB_SEARCH_PROVIDER": "duckduckgo",
                  "QDRANT_URL": "http://qdrant:6333",
                  "AUTO_DISCOVER_PUBLIC_IP": "true",
              }
              for k, v in defaults.items():
                  if k in existing:
                      existing[k]["value"] = v
                  else:
                      env_list.append({"name": k, "value": v})

              # Inject bulk ENV_FILE secret if provided in GitHub Secrets
              raw_env_file = os.environ.get("ENV_FILE", "").strip()
              if raw_env_file:
                  parsed_count = 0
                  for line in raw_env_file.splitlines():
                      line = line.strip()
                      if line and not line.startswith("#") and "=" in line:
                          k, v = line.split("=", 1)
                          k, v = k.strip(), v.strip().strip("\"'")
                          if k and v:
                              if k in existing:
                                  existing[k]["value"] = v
                              else:
                                  env_list.append({"name": k, "value": v})
                              parsed_count += 1
                  print(f"Injected {parsed_count} variables from GitHub secret ENV_FILE")

              # Inject individual secrets if available in GitHub workflow environment
              secret_names = [
                  "GEMINI_API_KEY", "GROQ_API_KEY", "STT_API_KEY", "SARVAM_API_KEY",
                  "ELEVENLABS_API_KEY", "TTS_API_KEY", "TWILIO_ACCOUNT_SID",
                  "TWILIO_AUTH_TOKEN", "TWILIO_FROM_NUMBER"
              ]
              for sec in secret_names:
                  val = os.environ.get(sec, "").strip()
                  if val:
                      if sec in existing:
                          existing[sec]["value"] = val
                      else:
                          env_list.append({"name": sec, "value": val})

              # Diagnostic audit of injected keys
              configured_keys = {item.get("name") for item in env_list if item.get("value")}
              print(f"Container environment has {len(configured_keys)} configured keys.")
              for check_key in ["GROQ_API_KEY", "GEMINI_API_KEY", "ELEVENLABS_API_KEY", "TWILIO_ACCOUNT_SID"]:
                  is_set = check_key in configured_keys
                  print(f"  - {check_key}: {'CONFIGURED' if is_set else 'NOT CONFIGURED (Will fail if called)'}")

          with open("clean-task-def.json", "w") as f:
              json.dump(td, f, indent=2)

          print("Successfully prepared clean Fargate task definition at clean-task-def.json")
          '

      - name: Inject new image into task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: clean-task-def.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Validate task definition before ECS registration
        env:
          TASK_DEF_FILE: ${{ steps.task-def.outputs.task-definition }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          EXPECTED_IMAGE: ${{ steps.build-image.outputs.image }}
        run: |
          python -c '
          import json, os, sys

          task_def_file = os.environ["TASK_DEF_FILE"]
          container_name = os.environ["CONTAINER_NAME"]
          expected_image = os.environ["EXPECTED_IMAGE"]

          print(f"Auditing rendered task definition: {task_def_file}")

          with open(task_def_file, "r") as f:
              td = json.load(f)

          errors = []

          # Check raw text for forbidden capabilities
          raw_text = json.dumps(td)
          if "SYS_NICE" in raw_text:
              errors.append("PROHIBITED: SYS_NICE capability found in task definition JSON!")
          if "SYS_RESOURCE" in raw_text:
              errors.append("PROHIBITED: SYS_RESOURCE capability found in task definition JSON!")

          # Compatibility and network mode verification
          compat = td.get("requiresCompatibilities", [])
          if "FARGATE" not in compat:
              errors.append(f"requiresCompatibilities must contain FARGATE, got: {compat}")

          actual_mode = td.get("networkMode")
          if actual_mode != "awsvpc":
              errors.append(f"networkMode must be awsvpc for Fargate, got: {actual_mode}")

          # Container audits
          containers = td.get("containerDefinitions", [])
          if not containers:
              errors.append("containerDefinitions is empty!")

          target_c = None
          for c in containers:
              c_name = c.get("name")
              if c_name == container_name:
                  target_c = c

              if c.get("privileged") is True:
                  errors.append(f"Container {c_name} has privileged=true (not supported on Fargate)")

              lp = c.get("linuxParameters")
              if lp:
                  caps = lp.get("capabilities", {})
                  add_caps = set(caps.get("add", []))
                  if "SYS_NICE" in add_caps:
                      errors.append(f"Container {c_name} has SYS_NICE in linuxParameters.capabilities.add")
                  if "SYS_RESOURCE" in add_caps:
                      errors.append(f"Container {c_name} has SYS_RESOURCE in linuxParameters.capabilities.add")

          if not target_c:
              errors.append(f"Target container {container_name} not found in containerDefinitions")
          else:
              actual_img = target_c.get("image")
              if actual_img != expected_image:
                  errors.append(f"Image mismatch: expected {expected_image}, got {actual_img}")

              # Verify application port mappings for all 3 services:
              # - 8080: voice-ai-service-VAI
              # - 8000: voice-ai-service-be
              # - 5173: voice-ai-fe-service
              ports = [p.get("containerPort") for p in target_c.get("portMappings", [])]
              for required_port in [8080, 8000, 5173]:
                  if required_port not in ports:
                      errors.append(f"Container {container_name} missing required port {required_port} mapping (found: {ports})")

          if errors:
              print("=" * 70)
              print("PRE-DEPLOYMENT AUDIT FAILED - ABORTING ECS REGISTRATION:")
              for err in errors:
                  print(f"  [ERROR] {err}")
              print("=" * 70)
              sys.exit(1)

          print(" Task definition validation PASSED: 100% compliant with AWS ECS Fargate (supports ports 8080, 8000, 5173).")
          '

      - name: Register base task definition with Amazon ECS
        id: register-task-def
        run: |
          echo "Registering task definition from ${{ steps.task-def.outputs.task-definition }}..."
          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://${{ steps.task-def.outputs.task-definition }} \
            --region ${{ env.AWS_REGION }} \
            --query taskDefinition.taskDefinitionArn \
            --output text)
          echo "Successfully registered task definition: $NEW_TASK_DEF_ARN"
          echo "task_def_arn=$NEW_TASK_DEF_ARN" >> $GITHUB_OUTPUT

      - name: Deploy to ECS Services (3 Services)
        env:
          NEW_TASK_DEF_ARN: ${{ steps.register-task-def.outputs.task_def_arn }}
          TARGET_INPUT: ${{ github.event.inputs.target_service || 'all' }}
        run: |
          # The 3 ECS Services:
          # 1. voice-ai-fe-service  (Frontend UI - port 5173)
          # 2. voice-ai-service-be  (Backend API - port 8000)
          # 3. voice-ai-service-VAI (All-in-One Voice AI - port 8080)
          if [ "$TARGET_INPUT" = "all" ]; then
            SERVICES=("voice-ai-service-VAI" "voice-ai-service-be" "voice-ai-fe-service")
          else
            SERVICES=("$TARGET_INPUT")
          fi

          echo "=========================================================="
          echo "Deploying to ${#SERVICES[@]} ECS Service(s): ${SERVICES[*]}"
          echo "Cluster: ${{ env.ECS_CLUSTER }}"
          echo "New Task Definition ARN: $NEW_TASK_DEF_ARN"
          echo "=========================================================="

          DEPLOYED_SERVICES=()

          for SVC in "${SERVICES[@]}"; do
            echo "----------------------------------------------------------"
            echo "Checking status for service: $SVC in cluster ${{ env.ECS_CLUSTER }}..."

            # Verify if service exists in cluster
            SVC_STATUS=$(aws ecs describe-services \
              --cluster ${{ env.ECS_CLUSTER }} \
              --services "$SVC" \
              --region ${{ env.AWS_REGION }} \
              --query "services[0].status" \
              --output text 2>/dev/null || echo "MISSING")

            if [ "$SVC_STATUS" != "ACTIVE" ]; then
              echo "Warning: Service $SVC is not ACTIVE in cluster ${{ env.ECS_CLUSTER }} (status: $SVC_STATUS). Skipping."
              continue
            fi

            echo "Updating service $SVC with task definition: $NEW_TASK_DEF_ARN..."
            aws ecs update-service \
              --cluster ${{ env.ECS_CLUSTER }} \
              --service "$SVC" \
              --task-definition "$NEW_TASK_DEF_ARN" \
              --force-new-deployment \
              --region ${{ env.AWS_REGION }}

            DEPLOYED_SERVICES+=("$SVC")
            echo " Rolling update triggered for $SVC."
          done

          if [ ${#DEPLOYED_SERVICES[@]} -eq 0 ]; then
            echo "::error::No active services were found or updated. Verify service names in cluster ${{ env.ECS_CLUSTER }}."
            exit 1
          fi

          echo "=========================================================="
          echo "Waiting for updated services to reach steady state..."
          echo "=========================================================="
          for SVC in "${DEPLOYED_SERVICES[@]}"; do
            echo "Waiting for service stability: $SVC..."
            aws ecs wait services-stable \
              --cluster ${{ env.ECS_CLUSTER }} \
              --services "$SVC" \
              --region ${{ env.AWS_REGION }}
            echo " Service $SVC is STABLE and HEALTHY!"
          done

      - name: Smoke Test Deployed Services
        run: |
          echo "=========================================================="
          echo "RUNNING POST-DEPLOYMENT HEALTH SMOKE TESTS"
          echo "=========================================================="
          # Discover public ALB DNS name if available
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --region ${{ env.AWS_REGION }} \
            --query "LoadBalancers[?contains(LoadBalancerName, 'voice') || contains(LoadBalancerName, 'vai') || contains(DNSName, 'elb')].DNSName" \
            --output text 2>/dev/null | awk '{print $1}')

          if [ -n "$ALB_DNS" ]; then
            echo "Discovered Load Balancer: http://$ALB_DNS"
            echo "Querying http://$ALB_DNS/health..."
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "http://$ALB_DNS/health" || echo "000")
            echo "Health endpoint returned HTTP code: $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              echo " ALB /health endpoint successfully verified: HTTP 200 OK!"
            else
              echo "Notice: ALB /health returned HTTP $HTTP_CODE (verify ALB listeners and target group health)."
            fi
          else
            echo "No public ALB DNS discovered; checking target health via AWS CLI..."
            aws elbv2 describe-target-groups \
              --region ${{ env.AWS_REGION }} \
              --query "TargetGroups[?contains(TargetGroupName, 'voice') || contains(TargetGroupName, 'vai')].TargetGroupArn" \
              --output text 2>/dev/null | while read -r TG_ARN; do
                if [ -n "$TG_ARN" ]; then
                  echo "Target Group: $TG_ARN"
                  aws elbv2 describe-target-health --target-group-arn "$TG_ARN" --region ${{ env.AWS_REGION }} || true
                fi
              done
          fi

      - name: Deployment Summary
        if: always()
        run: |
          echo "=========================================================="
          echo "ECS SERVICES DEPLOYMENT SUMMARY"
          echo "Cluster: ${{ env.ECS_CLUSTER }} | Region: ${{ env.AWS_REGION }}"
          echo "=========================================================="
          aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services voice-ai-service-VAI voice-ai-service-be voice-ai-fe-service \
            --region ${{ env.AWS_REGION }} \
            --query "services[*].{Service:serviceName,Status:status,Desired:desiredCount,Running:runningCount,TaskDefinition:taskDefinition}" \
            --output table || true
