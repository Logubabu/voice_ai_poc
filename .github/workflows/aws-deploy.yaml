name: Build and Deploy to ECS

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_service:
        description: 'Select ECS service to deploy (or "all" for all 3 services)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - voice-ai-service-VAI
          - voice-ai-service-be
          - voice-ai-fe-service

env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: voice-ai-poc
  ECS_CLUSTER: voice_ai_fr_cluster
  TASK_DEFINITION: voice-ai-task-definition
  CONTAINER_NAME: voice-ai

jobs:
  deploy:
    name: Build, Validate, and Deploy to ECS Fargate (3 Services)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building Docker image for platform linux/amd64: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build --platform linux/amd64 \
            --build-arg GIT_COMMIT_SHA=${{ github.sha }} \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "Pushing Docker images to Amazon ECR..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

          echo "Verifying ECR image digest..."
          ECR_DIGEST=$(aws ecr describe-images \
            --repository-name ${{ env.ECR_REPOSITORY }} \
            --image-ids imageTag=$IMAGE_TAG \
            --region ${{ env.AWS_REGION }} \
            --query "imageDetails[0].imageDigest" \
            --output text 2>/dev/null || echo "N/A")
          echo "ECR Image Tag:    $IMAGE_TAG"
          echo "ECR Image Digest: $ECR_DIGEST"

          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "image_digest=$ECR_DIGEST" >> $GITHUB_OUTPUT

      - name: Prepare and sanitize task definition for AWS Fargate
        id: prep-task-def
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          STT_API_KEY: ${{ secrets.STT_API_KEY }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TTS_API_KEY: ${{ secrets.TTS_API_KEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
        run: |
          echo "Downloading current active task definition or using repository fallback..."
          if aws ecs describe-task-definition --task-definition ${{ env.TASK_DEFINITION }} --query taskDefinition > raw-task-def.json 2>/dev/null; then
            echo "Successfully retrieved task definition from AWS ECS."
            export BASE_DEF="raw-task-def.json"
          else
            echo "Notice: Could not fetch active task definition from ECS. Using repo task-definition.json."
            export BASE_DEF="task-definition.json"
          fi

          python .github/scripts/prepare_task_def.py

      - name: Inject new image into task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: clean-task-def.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Validate task definition before ECS registration
        env:
          TASK_DEF_FILE: ${{ steps.task-def.outputs.task-definition }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          EXPECTED_IMAGE: ${{ steps.build-image.outputs.image }}
        run: |
          python .github/scripts/validate_task_def.py

      - name: Register base task definition with Amazon ECS
        id: register-task-def
        run: |
          echo "Registering task definition from ${{ steps.task-def.outputs.task-definition }}..."
          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://${{ steps.task-def.outputs.task-definition }} \
            --region ${{ env.AWS_REGION }} \
            --query taskDefinition.taskDefinitionArn \
            --output text)
          echo "Successfully registered task definition: $NEW_TASK_DEF_ARN"
          echo "task_def_arn=$NEW_TASK_DEF_ARN" >> $GITHUB_OUTPUT

      - name: Deploy to ECS Services (3 Services)
        env:
          NEW_TASK_DEF_ARN: ${{ steps.register-task-def.outputs.task_def_arn }}
          TARGET_INPUT: ${{ github.event.inputs.target_service || 'all' }}
        run: |
          # The 3 ECS Services:
          # 1. voice-ai-fe-service  (Frontend UI - port 5173)
          # 2. voice-ai-service-be  (Backend API - port 8000)
          # 3. voice-ai-service-VAI (All-in-One Voice AI - port 8080)
          if [ "$TARGET_INPUT" = "all" ]; then
            SERVICES=("voice-ai-service-VAI" "voice-ai-service-be" "voice-ai-fe-service")
          else
            SERVICES=("$TARGET_INPUT")
          fi

          echo "=========================================================="
          echo "Deploying to ${#SERVICES[@]} ECS Service(s): ${SERVICES[*]}"
          echo "Cluster: ${{ env.ECS_CLUSTER }}"
          echo "New Task Definition ARN: $NEW_TASK_DEF_ARN"
          echo "=========================================================="

          DEPLOYED_SERVICES=()

          for SVC in "${SERVICES[@]}"; do
            echo "----------------------------------------------------------"
            echo "Checking status for service: $SVC in cluster ${{ env.ECS_CLUSTER }}..."

            # Verify if service exists in cluster
            SVC_STATUS=$(aws ecs describe-services \
              --cluster ${{ env.ECS_CLUSTER }} \
              --services "$SVC" \
              --region ${{ env.AWS_REGION }} \
              --query "services[0].status" \
              --output text 2>/dev/null || echo "MISSING")

            if [ "$SVC_STATUS" != "ACTIVE" ]; then
              echo "Warning: Service $SVC is not ACTIVE in cluster ${{ env.ECS_CLUSTER }} (status: $SVC_STATUS). Skipping."
              continue
            fi

            echo "Updating service $SVC with task definition: $NEW_TASK_DEF_ARN..."
            aws ecs update-service \
              --cluster ${{ env.ECS_CLUSTER }} \
              --service "$SVC" \
              --task-definition "$NEW_TASK_DEF_ARN" \
              --force-new-deployment \
              --region ${{ env.AWS_REGION }}

            DEPLOYED_SERVICES+=("$SVC")
            echo " Rolling update triggered for $SVC."
          done

          if [ ${#DEPLOYED_SERVICES[@]} -eq 0 ]; then
            echo "::error::No active services were found or updated. Verify service names in cluster ${{ env.ECS_CLUSTER }}."
            exit 1
          fi

          echo "=========================================================="
          echo "Waiting for updated services to reach steady state..."
          echo "=========================================================="
          for SVC in "${DEPLOYED_SERVICES[@]}"; do
            echo "Waiting for service stability: $SVC..."
            aws ecs wait services-stable \
              --cluster ${{ env.ECS_CLUSTER }} \
              --services "$SVC" \
              --region ${{ env.AWS_REGION }}
            echo " Service $SVC is STABLE and HEALTHY!"
          done

      - name: Smoke Test Deployed Services
        run: |
          echo "=========================================================="
          echo "RUNNING POST-DEPLOYMENT HEALTH SMOKE TESTS"
          echo "=========================================================="
          # Discover public ALB DNS name if available
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --region ${{ env.AWS_REGION }} \
            --query "LoadBalancers[?contains(LoadBalancerName, 'voice') || contains(LoadBalancerName, 'vai') || contains(DNSName, 'elb')].DNSName" \
            --output text 2>/dev/null | awk '{print $1}')

          if [ -n "$ALB_DNS" ]; then
            echo "Discovered Load Balancer: http://$ALB_DNS"
            echo "Querying http://$ALB_DNS/health..."
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "http://$ALB_DNS/health" || echo "000")
            echo "Health endpoint returned HTTP code: $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              echo " ALB /health endpoint successfully verified: HTTP 200 OK!"
            else
              echo "Notice: ALB /health returned HTTP $HTTP_CODE (verify ALB listeners and target group health)."
            fi
          else
            echo "No public ALB DNS discovered; checking target health via AWS CLI..."
            aws elbv2 describe-target-groups \
              --region ${{ env.AWS_REGION }} \
              --query "TargetGroups[?contains(TargetGroupName, 'voice') || contains(TargetGroupName, 'vai')].TargetGroupArn" \
              --output text 2>/dev/null | while read -r TG_ARN; do
                if [ -n "$TG_ARN" ]; then
                  echo "Target Group: $TG_ARN"
                  aws elbv2 describe-target-health --target-group-arn "$TG_ARN" --region ${{ env.AWS_REGION }} || true
                fi
              done
          fi

      - name: Deployment Summary
        if: always()
        run: |
          echo "=========================================================="
          echo "ECS SERVICES DEPLOYMENT SUMMARY"
          echo "Cluster: ${{ env.ECS_CLUSTER }} | Region: ${{ env.AWS_REGION }}"
          echo "=========================================================="
          aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services voice-ai-service-VAI voice-ai-service-be voice-ai-fe-service \
            --region ${{ env.AWS_REGION }} \
            --query "services[*].{Service:serviceName,Status:status,Desired:desiredCount,Running:runningCount,TaskDefinition:taskDefinition}" \
            --output table || true
