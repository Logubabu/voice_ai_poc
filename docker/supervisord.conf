[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:freeswitch]
command=/usr/bin/freeswitch -nf -nonat
directory=/usr/local/freeswitch/etc/freeswitch
autostart=true
autorestart=true
priority=10
stopsignal=TERM
stopwaitsecs=15

stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:backend]
directory=/app/backend
command=/opt/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000
environment=PYTHONPATH="/app/backend",PATH="/opt/venv/bin:%(ENV_PATH)s",FREESWITCH_HOST="127.0.0.1:8021"
autostart=true
autorestart=true
priority=20
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=30
stopsignal=QUIT
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
